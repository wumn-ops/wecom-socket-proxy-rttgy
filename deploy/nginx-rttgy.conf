# Nginx 片段 — wecom-socket-proxy-rttgy（前缀 /rttgy，反代 8003）

location /wecom/aibot/callback/rttgy {
    proxy_pass http://192.168.140.92:8003;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location /health/rttgy {
    proxy_pass http://192.168.140.92:8003;
}

location /register/upload/rttgy {
    proxy_pass http://192.168.140.92:8003;
    client_max_body_size 10m;
}

location /register/daily/rttgy {
    proxy_pass http://192.168.140.92:8003;
    client_max_body_size 10m;
}

location /feedback/rttgy {
    proxy_pass http://192.168.140.92:8003;
}
